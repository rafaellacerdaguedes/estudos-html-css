<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 { /* Box-level */
            height: 70px;
            width: 300px;
            background-color: rgb(223, 251, 146);
            
            border: 5px solid red;

            padding: 10px 20px;

            margin: 10px auto 10px auto;

            outline: 5px dashed blue;
        }

        a { /* Inline-level */
            border-style: dashed;
            border-color: brown;
            border-width: 5px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas <a href="#">os links são exemplos de caixas inline-level.</a> Vamos ver como tudo isso funciona!</p>
</body>
</html>
