<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir essa imagem em dispisitívos diferentes ou simplesmente aumenta e diminua o tamnho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/Fantasyland.mp3" type="audio/mpeg">
        <source src="midia/Fantasyland.ogg" type="audio/ogg">
        <source src="midia/Fantasyland.wav" type="audio/wav">
        <p>Infelizmente seu navegador não suporta o arquivo de áudio. <a href="midia/Fantasyland.mp3">Clique aqui para baixar o áudio!</a></p>
    </audio>
</body>
</html>
