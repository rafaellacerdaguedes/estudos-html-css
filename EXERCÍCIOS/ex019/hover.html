<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }

        div:hover{
            color: blueviolet;
            width: 250px;
        }

        div > p{
            display: none;
        }

        div:hover > p{
            display: block;
            background-color: blanchedalmond;
            width: 250px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover Funcionando</h1>
    <p>Passe o mouse sobre o texto abaixo!</p>
    <div>
        Passe o mouse AQUI!
        <p>TEXTO ESCONDIDO NA DIV!</p>
    </div>
</body>
</html>
