<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospedagem de vídeos HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos HTML5</h1>
    <p>Este vídeo estpa hospedado em meu próprio servidor.</p>

    <video width="560" poster="imagens/foto-capa.jpg" controls autoplay loop>
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.webm" type="video/webm">
        <source src="midia/meu-video-full.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com o arquivo de vídeo</p>
    </video>

    <h1>Inserindo vídeos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/lZt8Wh9p2LM?si=lB0Tena2aNZsL8Gt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
